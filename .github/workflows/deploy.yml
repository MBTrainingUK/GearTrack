name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_STORAGE_ENABLED: 'false'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Backend lands before the new frontend: a build that tightens security rules
  # must not have its client go live first. If this job fails, Pages never
  # deploys and production keeps serving the previous frontend — the safe
  # outcome, since that frontend already works against the old rules.
  #
  # Firebase Storage is deliberately absent. It has never been set up on the
  # production project (`VITE_STORAGE_ENABLED` is 'false' in both workflows),
  # and including it fails the deploy outright.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install functions dependencies
        run: npm ci --prefix functions

      # Rules first and on their own: idempotent, instant, and the part that
      # actually closes security holes. Nothing else can hold it up.
      - name: Deploy Firestore rules to production
        run: npx firebase-tools deploy --only firestore:rules --project production --force --token "${{ secrets.FIREBASE_TOKEN }}"

      # No --force here, deliberately. If firestore.indexes.json ever drifts
      # from what is live, this must fail loudly rather than silently drop an
      # index that production queries depend on. Rebuilding one takes hours.
      - name: Deploy Firestore indexes to production
        run: npx firebase-tools deploy --only firestore:indexes --project production --token "${{ secrets.FIREBASE_TOKEN }}"

      # --force is required here to auto-accept the functions cleanup policy.
      - name: Deploy Cloud Functions to production
        run: npx firebase-tools deploy --only functions --project production --force --token "${{ secrets.FIREBASE_TOKEN }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
